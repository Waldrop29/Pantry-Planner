name: Repository Autobot Workflow

on:
  push:
    branches: [ main ]
  issues:
    types: [ opened ]

# This block explicitly forces GitHub to give this specific run write access
permissions:
  contents: write
  issues: write

jobs:
  activate-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy Code to Runner
        uses: actions/checkout@v4

      # Explicitly use the default GITHUB_TOKEN for git authentication
      - name: Configure Bot Persona
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git

      - name: Execute Autobot Operations
        run: |
          echo "### Autobot Execution Log" > autobot-status.md
          echo "Status: Operational 🤖" >> autobot-status.md
          echo "Last run initialized on: $(date)" >> autobot-status.md

      - name: Commit and Push Changes
        run: |
          git add autobot-status.md
          git diff-index --quiet HEAD || git commit -m "chore: automated status update by autobot"
          git push origin main
