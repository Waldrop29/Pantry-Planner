name: Automated Feature PR Creator

on:
  push:
    branches-ignore:
      - main

permissions:
  pull-requests: write # Essential permission so the runner can open PRs

jobs:
  create-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Feature Code
        uses: actions/checkout@v4

      # Uses GitHub's official command line utility to open a PR directly from your branch
      - name: Open Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The "|| true" handles it gracefully if a PR for this branch already exists
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "🚀 Feature Deploy: Merging ${{ github.ref_name }} into Main" \
            --body "## 🤖 Automated Bot PR
            Hey! Your repository autobot noticed you just pushed some fresh code to the branch \`${{ github.ref_name }}\`.
            
            I have generated this Pull Request automatically so you don't have to! Review your Pantry Planner changes below and click **Merge** when you are ready to ship it to main." || true
