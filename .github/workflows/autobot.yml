name: Automated Feature PR Creator

# 1 & 2: Wakes up whenever you push ANY new feature branch to GitHub (except main)
on:
  push:
    branches-ignore:
      - main

permissions:
  pull-requests: write # Crucial so the bot can open PRs for you

jobs:
  create-pr:
    runs-on: ubuntu-latest
    
    steps:
      # 3: The bot wakes up and downloads the code you just pushed
      - name: Checkout Feature Code
        uses: actions/checkout@v4

      # 4: The bot uses GitHub's API to automatically generate the Pull Request into main
      - name: Automatically Open PR into Main
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: automatic branch sync"
          title: "🚀 Feature Deploy: Merging ${{ github.ref_name }} into Main"
          body: |
            ## 🤖 Automated Bot PR
            Hey! Your repository autobot noticed you just pushed some fresh code to the branch `[${{ github.ref_name }}]`.
            
            I have generated this Pull Request automatically so you don't have to! Review your HTML/CSS/JS changes below and click **Merge** when you're ready to deploy it to main.
          branch: ${{ github.ref_name }} # Keeps it locked to the feature branch you pushed
          base: main                     # Targets your locked down main branch
