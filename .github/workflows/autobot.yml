name: Repository Autobot Workflow

on:
  push:
    branches: [ main ]

# Explicitly grant the runner permission to write code and manage PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  activate-bot:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Download your repo code onto the runner
      - name: Deploy Code to Runner
        uses: actions/checkout@v4

      # 2. Identify the bot to Git
      - name: Configure Bot Persona
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      # 3. Create or update your file
      - name: Execute Autobot Operations
        run: |
          echo "### 🤖 Autobot Control Panel" > bot_status.md
          echo "Last run completed successfully on: $(date)" >> bot_status.md
          echo "Operating entirely through automated PR branches!" >> bot_status.md

      # 4. Safely package the changes into a new branch and open a PR
      - name: Create Pull Request Safely
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated status update by autobot"
          title: "🤖 Autobot Status Update"
          body: "This Pull Request was safely generated automatically by your repository autobot workflow to comply with branch protection rules."
          branch: autobot/status-update
          base: main
